<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- StarRaft 应用图标：星夜、方块山丘与木筏。遵循 macOS 图标网格（824px 圆角矩形 + 阴影） -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f63"/>
      <stop offset="0.55" stop-color="#4b2f9c"/>
      <stop offset="1" stop-color="#8a4fd8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f8a"/>
      <stop offset="1" stop-color="#141850"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff7d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)"/>
  </g>

  <g clip-path="url(#tile)">
    <!-- 星星 -->
    <g fill="#ffffff">
      <rect x="220" y="230" width="12" height="12" opacity="0.9"/>
      <rect x="330" y="180" width="8" height="8" opacity="0.7"/>
      <rect x="760" y="210" width="10" height="10" opacity="0.85"/>
      <rect x="820" y="330" width="8" height="8" opacity="0.6"/>
      <rect x="250" y="400" width="8" height="8" opacity="0.6"/>
      <rect x="690" y="420" width="6" height="6" opacity="0.5"/>
      <rect x="180" y="330" width="6" height="6" opacity="0.5"/>
    </g>

    <!-- 主星：四角星 + 光晕 -->
    <circle cx="512" cy="330" r="220" fill="url(#glow)"/>
    <path d="M512 170 L548 294 L672 330 L548 366 L512 490 L476 366 L352 330 L476 294 Z" fill="#fffbe8"/>

    <!-- 方块山丘 -->
    <path d="M100 600 L100 560 L180 560 L180 528 L260 528 L260 560 L340 560 L340 592 L420 592 L420 624 L100 624 Z" fill="#3a2f8f"/>
    <path d="M924 624 L604 624 L604 584 L680 584 L680 552 L760 552 L760 520 L840 520 L840 552 L924 552 Z" fill="#3a2f8f"/>

    <!-- 水面 -->
    <rect x="100" y="620" width="824" height="320" fill="url(#water)"/>
    <rect x="200" y="760" width="160" height="10" rx="5" fill="#fff7d6" opacity="0.18"/>
    <rect x="640" y="800" width="180" height="10" rx="5" fill="#fff7d6" opacity="0.18"/>
    <rect x="470" y="850" width="90" height="8" rx="4" fill="#fff7d6" opacity="0.14"/>

    <!-- 木筏 -->
    <circle cx="560" cy="640" r="120" fill="url(#lantern)"/>
    <rect x="356" y="676" width="312" height="34" rx="8" fill="#a8693a"/>
    <rect x="356" y="676" width="312" height="10" rx="5" fill="#c98a52"/>
    <rect x="376" y="710" width="272" height="22" rx="7" fill="#7a4a27"/>
    <rect x="420" y="676" width="10" height="56" fill="#7a4a27" opacity="0.6"/>
    <rect x="500" y="676" width="10" height="56" fill="#7a4a27" opacity="0.6"/>
    <rect x="580" y="676" width="10" height="56" fill="#7a4a27" opacity="0.6"/>
    <!-- 桅杆与帆 -->
    <rect x="500" y="500" width="14" height="180" rx="4" fill="#5e3a1e"/>
    <path d="M516 510 L640 660 L516 660 Z" fill="#f4ecd8"/>
    <path d="M516 510 L640 660 L590 660 Z" fill="#d9cdb2"/>
    <!-- 灯笼 -->
    <rect x="452" y="628" width="30" height="36" rx="7" fill="#ffd27a"/>
    <rect x="460" y="620" width="14" height="10" rx="3" fill="#5e3a1e"/>

    <!-- 高光 -->
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  </g>

  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
